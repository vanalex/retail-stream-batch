# Infrastructure for retail-stream-batch
# Host-side clients (Spark local[*], sbt run, IDE) use:
#   MySQL    jdbc:mysql://localhost:3306/<db>   user=spark / pass=spark
#   Kafka    localhost:9092
#   Redis    localhost:6379
#   Console  http://localhost:8080
# Containers on the same network use mysql:3306, redpanda:29092, redis:6379.

name: retail-stream-batch

services:

  # ---------------------------------------------------------------- MySQL 8
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: spark
      MYSQL_USER: spark
      MYSQL_PASSWORD: spark
      MYSQL_DATABASE: spark_de
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates warehouse_stock, global_stock, website_stats + grants (first start only)
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------- Redpanda
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      # Same listener layout as the old Kafka service: internal 29092, host 9092
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=warn
    ports:
      - "9092:9092"     # Kafka API
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "19644:9644"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot job: creates the topics used by the course pipelines
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in spark.streaming.website.visits spark.streaming.carts.abandoned spark.exercise.lastaction.long; do
          rpk topic create "$$t" -p 1 -r 1 -X brokers=redpanda:29092 || true
        done
        rpk topic list -X brokers=redpanda:29092
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------- Redis
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redpanda-data:
  redis-data:
